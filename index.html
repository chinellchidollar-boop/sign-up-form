
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odin Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="signup-page">

    <!-- LEFT SIDE -->
    <aside class="hero-panel">
      <div class="brand">
        <img src="odin-lined.png" alt="Odin logo" class="odin-logo">
        <span class="brand-name">ODIN</span>
      </div>

      <p class="photo-credit">
        Photo by <a href="https://unsplash.com/">Halie West</a>
        on <a href="https://unsplash.com/">Unsplash</a>
      </p>
    </aside>

    <!-- RIGHT SIDE -->
    <section class="form-panel">

      <header class="intro">
        <p>
          This is not a real online service! You know you need
          something like this in your life to help you realize
          your deepest dreams. Sign up <em>now</em> to get started.
        </p>

        <p>You <em>know</em> you want to.</p>
      </header>

      <form id="signup-form" novalidate>
        <div class="form-content">
          <h1>Let’s do this!</h1>

          <div class="fields">

            <div class="field">
              <label for="first-name">FIRST NAME</label>
              <input id="first-name" name="firstName" type="text" required>
            </div>

            <div class="field">
              <label for="last-name">LAST NAME</label>
              <input id="last-name" name="lastName" type="text" required>
            </div>

            <div class="field">
              <label for="email">EMAIL</label>
              <input id="email" name="email" type="email" required>
            </div>

            <div class="field">
              <label for="phone">PHONE NUMBER</label>
              <input id="phone" name="phone" type="tel">
            </div>

            <div class="field">
              <label for="password">PASSWORD</label>
              <input id="password" name="password" type="password"
                     minlength="8" required>
            </div>

            <div class="field">
              <label for="confirm-password">CONFIRM PASSWORD</label>
              <input id="confirm-password" name="confirmPassword"
                     type="password" required>
            </div>

          </div>
        </div>

        <div class="form-actions">
          <button type="submit">Create Account</button>
          <p id="message" aria-live="polite"></p>

          <p class="login-prompt">
            Already have an account?
            <a href="#" id="login-link">Log in</a>
          </p>
        </div>
      </form>

    </section>
  </main>
